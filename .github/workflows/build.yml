name: Build catgirl
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl xz-utils
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download iOS SDK
        run: |
          mkdir -p $HOME/theos/sdks
          # Скачиваем SDK 15.6, он стабильный и точно есть на зеркалах
          wget -q https://github.com/theos/sdks/archive/refs/heads/master.zip -O sdks.zip
          unzip -q sdks.zip
          mv sdks-master/iPhoneOS15.6.sdk $HOME/theos/sdks/ || mv sdks-master/iPhoneOS16.5.sdk $HOME/theos/sdks/
          rm -rf sdks.zip sdks-master

      - name: Build
        run: make package

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: catgirl-Dylib
          path: .theos/obj/debug/catgirl.dylib
