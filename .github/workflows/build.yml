name: Build catgirl
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos, SDK & Toolchain
        run: |
          sudo apt-get update
          # Устанавливаем всё нужное, включая libtinfo5 для старого тулчейна
          sudo apt-get install -y make git curl unzip xz-utils wget libtinfo5
          
          # 1. Theos
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
          # 2. SDK (качаем и распаковываем)
          wget -q https://github.com/theos/sdks/archive/refs/heads/master.zip -O sdks.zip
          unzip -q sdks.zip
          mkdir -p $HOME/theos/sdks
          mv sdks-master/* $HOME/theos/sdks/
          rm -rf sdks.zip sdks-master
          
          # 3. Toolchain (Bingner's arm64e, как в вики)
          mkdir -p $HOME/theos/toolchain/linux/iphone
          cd $HOME/theos/toolchain/linux
          wget -q https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma
          
          # Распаковываем во временную папку и переносим содержимое
          mkdir tmp_toolchain
          tar --lzma -xvf linux-ios-arm64e-clang-toolchain.tar.lzma -C tmp_toolchain
          mv tmp_toolchain/ios-arm64e-clang-toolchain/* iphone/
          rm -rf tmp_toolchain linux-ios-arm64e-clang-toolchain.tar.lzma
          
          # 4. ФИКС libtinfo (если пакет libtinfo5 не встал, создаем симлинк)
          # Проверяем, есть ли файл, если нет — линкуем
          if [ ! -f /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            sudo ln -s /lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          fi

      - name: Build
        run: make package

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: catgirl-Dylib
          path: .theos/obj/debug/catgirl.dylib
