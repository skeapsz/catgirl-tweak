name: Build catgirl
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl unzip xz-utils
          
          # 1. Качаем Theos
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
          # 2. Качаем SDK
          wget -q https://github.com/theos/sdks/archive/refs/heads/master.zip -O sdks.zip
          unzip -q sdks.zip
          mkdir -p $HOME/theos/sdks
          mv sdks-master/* $HOME/theos/sdks/ || true
          rm -rf sdks.zip sdks-master
          
          # 3. Качаем тулчейн (компилятор)
          wget -q https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma -O toolchain.tar.lzma
          tar -xf toolchain.tar.lzma -C $HOME/theos/toolchain/linux/ 2>/dev/null || true
          mv $HOME/theos/toolchain/linux/linux-ios-arm64e-clang-toolchain $HOME/theos/toolchain/linux/iphone || true
          rm toolchain.tar.lzma

      - name: Build
        run: |
          ls -la
          make package

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: catgirl-Dylib
          path: .theos/obj/debug/catgirl.dylib
